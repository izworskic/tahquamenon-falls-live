name: Owner release verification

on:
  pull_request:
  push:
    branches:
      - main
      - agent/creator-authority-20261006

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install runtime dependency
        run: npm install --no-package-lock
      - name: Run full owner verification gate
        run: npm run verify
